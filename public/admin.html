<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadConnector — Painel</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --err:#f85149; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#656d76; } }
  * { box-sizing:border-box; } body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid #8883; }
  h1 { font-size:1.2rem; margin:0; } .kpis { display:flex; gap:18px; color:var(--muted); font-size:.9rem; } .kpis b { color:var(--text); font-size:1.1rem; }
  input { padding:9px 12px; border-radius:8px; border:1px solid #8885; background:transparent; color:inherit; font:inherit; }
  button { padding:7px 11px; border:1px solid #8885; border-radius:7px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #login { max-width:380px; margin:80px auto; padding:24px; background:var(--card); border-radius:14px; text-align:center; }
  #login input { width:100%; margin:14px 0; }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; padding:24px; align-items:start; }
  .col { background:var(--card); border-radius:12px; padding:14px; border:1px solid #8883; }
  .col h2 { font-size:.95rem; margin:0 0 12px; display:flex; justify-content:space-between; }
  .lead { border:1px solid #8883; border-radius:10px; padding:12px; margin-bottom:10px; font-size:.9rem; }
  .lead b { display:block; } .lead small { color:var(--muted); display:block; word-break:break-word; }
  .lead p { margin:8px 0; color:var(--muted); } .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .hidden { display:none !important; } .err { color:var(--err); }
</style>
</head>
<body>
<section id="login">
  <h1>📇 LeadConnector</h1>
  <input id="key" type="password" placeholder="Sua API_KEY" autocomplete="current-password">
  <button class="primary" id="enter">Entrar</button>
  <div id="loginErr" class="err"></div>
</section>

<section id="app" class="hidden">
  <header>
    <h1>📇 Funil de leads</h1>
    <div class="kpis" id="kpis"></div>
    <div><input id="q" placeholder="Buscar..."> <button id="csv">⬇ CSV</button> <button id="out">Sair</button></div>
  </header>
  <div class="board" id="board"></div>
</section>

<script>
  const API = '';
  const STAGES = { novo:'🆕 Novo', em_contato:'📞 Em contato', convertido:'✅ Convertido' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let KEY = sessionStorage.getItem('lc_key') || '';

  async function api(path, opt = {}) {
    const r = await fetch(API + path, { ...opt, headers: { 'x-api-key': KEY, 'Content-Type': 'application/json' } });
    if (r.status === 401 || r.status === 403) { logout(); throw new Error('Chave inválida'); }
    if (r.status === 204) return null;
    const d = await r.json(); if (!r.ok) throw new Error(d.error); return d;
  }
  function logout() { sessionStorage.removeItem('lc_key'); KEY = ''; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

  async function load() {
    const q = $('q').value.trim();
    const [list, stats] = await Promise.all([api('/api/leads?limit=100' + (q ? '&q=' + encodeURIComponent(q) : '')), api('/api/leads/stats')]);
    $('kpis').innerHTML = `<span><b>${stats.total}</b> leads</span><span><b>${stats.conversionRate}%</b> conversão</span>`;
    $('board').innerHTML = Object.entries(STAGES).map(([s, label]) => {
      const items = list.data.filter((l) => l.stage === s);
      return `<div class="col"><h2>${label}<span>${items.length}</span></h2>${items.map((l) => `
        <div class="lead"><b>${esc(l.name)}</b>
          <small>${esc(l.email)}</small>${l.phone ? `<small>${esc(l.phone)}</small>` : ''}
          ${l.message ? `<p>${esc(l.message.slice(0, 140))}</p>` : ''}
          <small>${new Date(l.created_at).toLocaleString('pt-BR')}${l.source ? ' · ' + esc(l.source) : ''}</small>
          <div class="actions">${Object.entries(STAGES).filter(([k]) => k !== s).map(([k, t]) =>
            `<button data-id="${l.id}" data-stage="${k}">→ ${t}</button>`).join('')}
            <button data-del="${l.id}">🗑</button></div></div>`).join('') || '<small>Nenhum lead</small>'}</div>`;
    }).join('');
  }

  async function enter() {
    try { await load(); $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }
    catch (e) { $('loginErr').textContent = e.message; }
  }
  $('enter').onclick = () => { KEY = $('key').value.trim(); sessionStorage.setItem('lc_key', KEY); enter(); };
  $('out').onclick = logout;
  $('q').oninput = () => { clearTimeout(window.t); window.t = setTimeout(load, 300); };
  $('csv').onclick = async () => {
    const r = await fetch(API + '/api/leads/export.csv', { headers: { 'x-api-key': KEY } });
    const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'leads.csv'; a.click();
  };
  $('board').onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.stage) await api('/api/leads/' + b.dataset.id, { method: 'PATCH', body: JSON.stringify({ stage: b.dataset.stage }) });
    else if (b.dataset.del && confirm('Apagar este lead?')) await api('/api/leads/' + b.dataset.del, { method: 'DELETE' });
    load();
  };
  if (KEY) enter();
</script>
</body>
</html>
